<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">Logo</div>

        <!-- Hamburger -->
        <div class="menu-icon" onclick="toggleMenu()">
            ☰
        </div>

        <div class="links" id="mobileMenu">
            <ul>
                <li onclick="showPage('main-page')">link-1</li>
                <li onclick="showPage('database-box')">link-2</li>
                <li onclick="showPage('sorted-table-page')">link-3</li>
                <li onclick="showPage('download-data')">link-4</li>
            </ul>
        </div>
    </nav>

    <main id="main-page" class="content active">
        <div class="container">

            <form id="customerForm">
                
                <label for="name">Name : </label><br>
                <input type="text" name="name" id="name" class="input-data" placeholder="Enter Customer's Full Name" required><br><br>
                
                <label for="mob">Mobile No : </label><br>
                <input type="tel" name="mob" id="mob" maxlength="10" pattern="[0-9]{10}" class="input-data" placeholder="Enter Mobile Number" required><br><br>
                
                <label for="product">Product Name :</label><br>
                <select name="product-name" id="product" class="input-data" required>
                    <option selected disabled>Select Product Name</option>
                    <option value="op-1">op-1</option>
                    <option value="op-2">op-2</option>
                    <option value="op-3">op-3</option>
                    <option value="op-4">op-4</option>
                </select><br><br>
                
                <label for="price">Price : </label><br>
                <input type="number" name="price" id="price" class="input-data" placeholder="Enter Price of Product" required><br><br>
                
                <label for="mode">Mode of Payment : </label><br>
                <select name="mode" id="mode" class="input-data">
                    <option selected disabled>Select Payment Method</option>
                    <option value="online">Online</option>
                    <option value="Cash">Cash</option>
                </select><br><br>
                
                <button type="submit" id="submit" value="submit">Submit</button>
            </form>
        </div>
    </main>

    <div id="database-box" class="content">
        <div id="database"></div>
    </div>

    <div id="sorted-table-page" class="content">
        <div id="search-box">
            <input type="date" id="date" name="date">
            <button id="date-btn" onclick="searchData()">Find Result</button><br>
        </div>
        <div id="sorted-database"></div>
    </div>
    
    <div id="download-data" class="content">
        <div id="download-box">
            <div>
                <input type="month" id="monthPicker">
            </div>
            
            <div>
                <button id="download-btn" onclick="downloadMonthlyData()">
                    Download Monthly Report
                </button>
            </div>
        </div>
    </div>
    
    <footer>
        &copy; All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
